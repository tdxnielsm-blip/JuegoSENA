<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X-Men '97 - Danger Room Simulator</title>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Cinzel:wght@700&family=Teko:wght@600&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="comic-bg"></div>
    <div class="grid-lines"></div>
    
    <div class="camera" id="cam">
        <div class="hud">
            <div class="plate">
                <div class="name hero">MUTANTE X</div>
                <div class="hp-box"><div id="p-hp-bg" class="hp-bg"></div><div id="p-hp" class="hp-fill hero"></div></div>
            </div>
            <div id="combo-txt" class="level-badge">NIVEL 1</div>
            <div class="plate enemy">
                <div id="e-name" class="name boss">CENTINELA MK-I</div>
                <div class="hp-box"><div id="e-hp-bg" class="hp-bg"></div><div id="e-hp" class="hp-fill boss"></div></div>
            </div>
        </div>

        <main class="arena">
            <div id="p1" class="fighter p1 idle">
                <div class="slash-fx"></div>
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 420" width="300" height="420">
                    <defs>
                        <linearGradient id="skinGrad" x1="0" y1="0" x2="1" y2="1">
                            <stop offset="0%" stop-color="#ff1a1a"/>
                            <stop offset="100%" stop-color="#800000"/>
                        </linearGradient>
                        <linearGradient id="suitGrad" x1="0" y1="0" x2="1" y2="0">
                            <stop offset="0%" stop-color="#262626"/>
                            <stop offset="50%" stop-color="#0a0a0a"/>
                            <stop offset="100%" stop-color="#1f1f1f"/>
                        </linearGradient>
                        <linearGradient id="bladeGrad" x1="0" y1="0" x2="1" y2="1">
                            <stop offset="0%" stop-color="#ffffff"/>
                            <stop offset="50%" stop-color="#00ffff"/>
                            <stop offset="100%" stop-color="#0088cc"/>
                        </linearGradient>
                    </defs>

                    <g class="hero-realistic">
                        <path d="M 105 260 L 85 390 L 125 390 L 135 260 Z" fill="url(#suitGrad)"/>
                        <path d="M 85 340 L 90 390 L 125 390 L 115 340 Z" fill="var(--x-blue)"/> <path d="M 145 260 L 165 390 L 205 390 L 180 260 Z" fill="url(#suitGrad)"/>
                        <path d="M 160 340 L 165 390 L 205 390 L 195 340 Z" fill="var(--x-blue)"/> <path d="M 165 140 L 210 270" stroke="url(#bladeGrad)" stroke-width="7" stroke-linecap="round"/>
                        <path d="M 155 130 L 175 145" stroke="var(--x-yellow)" stroke-width="5"/> <path d="M 95 125 L 195 125 L 175 260 L 115 260 Z" fill="url(#suitGrad)"/>
                        <path d="M 115 125 L 135 260 L 125 260 L 105 125 Z" fill="var(--x-blue)"/> <path d="M 175 125 L 155 260 L 165 260 L 185 125 Z" fill="var(--x-blue)"/>
                        
                        <rect x="105" y="250" width="80" height="18" fill="#222" rx="3"/>
                        <circle cx="145" cy="259" r="10" fill="var(--x-yellow)" stroke="#000" stroke-width="2.5"/>
                        <path d="M 141 255 L 149 263 M 149 255 L 141 263" stroke="#000" stroke-width="2"/>

                        <path d="M 185 130 L 225 200 L 210 250" fill="none" stroke="url(#suitGrad)" stroke-width="16" stroke-linecap="round"/>
                        <circle cx="210" cy="250" r="11" fill="url(#skinGrad)"/>

                        <path d="M 130 110 L 160 110 L 165 135 L 125 135 Z" fill="url(#skinGrad)"/>
                        <circle cx="145" cy="85" r="30" fill="url(#skinGrad)"/>
                        
                        <path d="M 112 85 C 108 25, 182 25, 178 85 L 183 98 C 170 92, 120 92, 107 98 Z" fill="#121212" stroke="none"/>
                        <path d="M 118 70 C 130 55, 160 55, 172 70" stroke="#333" stroke-width="3" fill="none"/> <path d="M 132 80 L 142 86 M 158 80 L 148 86" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
                        <path d="M 138 98 Q 145 106 152 98" stroke="#400" stroke-width="2.5" fill="none" stroke-linecap="round"/>
                    </g>

                    <g class="hero-arm-front" style="transform-origin: 105px 135px;">
                        <path d="M 75 230 L 25 50" stroke="url(#bladeGrad)" stroke-width="9" stroke-linecap="round"/>
                        <path d="M 58 210 L 92 225" stroke="var(--x-yellow)" stroke-width="5"/> <path d="M 105 135 L 65 190 L 75 230" fill="none" stroke="url(#suitGrad)" stroke-width="18" stroke-linecap="round"/>
                        <circle cx="75" cy="230" r="12" fill="url(#skinGrad)"/>
                    </g>
                </svg>
            </div>

            <div id="p2" class="fighter p2 idle">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 500" width="450" height="500">
                    <defs>
                        <linearGradient id="sentinelArmor" x1="0" y1="0" x2="1" y2="1">
                            <stop offset="0%" stop-color="#7a00cc"/>
                            <stop offset="50%" stop-color="#4d0080"/>
                            <stop offset="100%" stop-color="#2a0044"/>
                        </linearGradient>
                        <linearGradient id="sentinelMag" x1="0" y1="0" x2="0" y2="1">
                            <stop offset="0%" stop-color="#ff1493"/>
                            <stop offset="100%" stop-color="#99004d"/>
                        </linearGradient>
                    </defs>
                    <g class="boss-realistic">
                        <path d="M 90 280 L 360 280 L 330 480 L 120 480 Z" fill="url(#sentinelArmor)"/>
                        
                        <circle cx="90" cy="280" r="65" fill="url(#sentinelMag)"/>
                        <circle cx="360" cy="280" r="65" fill="url(#sentinelMag)"/>
                        <circle cx="90" cy="280" r="45" fill="url(#sentinelArmor)"/>
                        <circle cx="360" cy="280" r="45" fill="url(#sentinelArmor)"/>

                        <path d="M 140 300 L 310 300 L 280 410 L 170 410 Z" fill="url(#sentinelMag)"/>
                        <circle cx="225" cy="355" r="32" fill="var(--x-yellow)" stroke="#111" stroke-width="4"/>
                        <circle cx="225" cy="355" r="15" fill="#fff" opacity="0.8"/>

                        <rect x="185" y="220" width="80" height="60" fill="#151515" rx="5"/>
                        <line x1="205" y1="220" x2="205" y2="280" stroke="#000" stroke-width="6"/>
                        <line x1="225" y1="220" x2="225" y2="280" stroke="#000" stroke-width="6"/>
                        <line x1="245" y1="220" x2="245" y2="280" stroke="#000" stroke-width="6"/>

                        <path d="M 165 70 L 285 70 L 310 220 L 140 220 Z" fill="url(#sentinelArmor)"/>
                        <path d="M 165 70 L 145 20 L 195 70 Z" fill="url(#sentinelMag)"/>
                        <path d="M 285 70 L 305 20 L 255 70 Z" fill="url(#sentinelMag)"/>
                        
                        <path d="M 185 110 L 265 110 L 255 205 L 195 205 Z" fill="url(#sentinelMag)"/>
                        
                        <polygon points="195,135 225,142 210,152" fill="var(--x-yellow)" filter="drop-shadow(0 0 8px #ffcc00)"/>
                        <polygon points="255,135 225,142 240,152" fill="var(--x-yellow)" filter="drop-shadow(0 0 8px #ffcc00)"/>
                        
                        <rect x="205" y="175" width="40" height="18" fill="#111" rx="2"/>
                        <line x1="215" y1="175" x2="215" y2="193" stroke="#fff" stroke-width="3"/>
                        <line x1="225" y1="175" x2="225" y2="193" stroke="#fff" stroke-width="3"/>
                        <line x1="235" y1="175" x2="235" y2="193" stroke="#fff" stroke-width="3"/>
                    </g>
                </svg>
            </div>
        </main>
    </div>

    <div class="panel">
        <div class="controls">
            <button id="btn-atk" class="btn btn-atk" onclick="action('atk')">TAJO X</button>
            <button id="btn-def" class="btn btn-def" onclick="action('def')">DEFENSA</button>
            <button id="btn-ult" class="btn btn-ult" onclick="openTrivia()">ENLACE CEREBRO (PREGUNTAS)</button>
        </div>
    </div>

    <div class="modal" id="modal">
        <div class="m-box">
            <h2 class="m-title">SISTEMA CEREBRO: PROTOCOLO DE COMBATE</h2>
            <p class="m-q" id="m-q">Cargando base de datos...</p>
            <div class="opts-grid" id="m-opts"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
