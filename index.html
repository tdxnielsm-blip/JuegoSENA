<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>X-Men '97 - Sala de Peligro: Progresión</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Cinzel:wght@700&family=Press+Start+2P&family=Teko:wght@600&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Pantalla de Inicio -->
    <div id="intro-screen" class="sf-intro">
        <div class="sf-bg">
            <div class="sf-bg-blue"></div>
            <div class="sf-bg-red"></div>
        </div>
        <div class="sf-content">
            <div class="sf-player">
                <div class="sf-portrait p1-port"></div>
                <div class="sf-name-box">
                    <span class="sf-player-tag">1P</span>
                    <h2 class="sf-name p1-name">MUTANTE X</h2>
                </div>
            </div>
            <div class="sf-vs-badge">VS</div>
            <div class="sf-player">
                <div class="sf-portrait p2-port"></div>
                <div class="sf-name-box text-right">
                    <span class="sf-player-tag">CPU</span>
                    <h2 class="sf-name p2-name">SALA DE PELIGRO</h2>
                </div>
            </div>
        </div>
        <button id="start-btn" class="sf-start-btn">
            <span class="insert-text">INSERT COIN</span><br><br>
            <span class="blink press-text">PRESS START</span>
        </button>
    </div>

    <!-- Anunciador -->
    <div id="fight-announcer" class="sf-announcer hidden">NIVEL 1</div>

    <!-- Fondos -->
    <div class="comic-bg"></div>
    <div class="grid-lines"></div>
    
    <!-- CONTENEDOR PRINCIPAL DEL JUEGO -->
    <div class="camera" id="cam">
        <!-- HUD: Barras de vida -->
        <div class="hud">
            <div class="plate">
                <div class="name hero">MUTANTE X</div>
                <div class="hp-box"><div id="p-hp-bg" class="hp-bg"></div><div id="p-hp" class="hp-fill hero"></div></div>
            </div>
            <div id="combo-txt" class="level-badge">NIVEL 1</div>
            <div class="plate enemy">
                <div id="e-name" class="name boss">CARGANDO...</div>
                <div class="hp-box"><div id="e-hp-bg" class="hp-bg"></div><div id="e-hp" class="hp-fill boss"></div></div>
            </div>
        </div>

        <!-- ARENA -->
        <main class="arena">
            <!-- JUGADOR 1 (Cuerpo completo renderizado aquí) -->
            <div id="p1" class="fighter p1 idle">
                <div class="slash-fx"></div>
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 440" preserveAspectRatio="xMidYMax meet">
                    <defs>
                        <linearGradient id="skinGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#ff1a1a"/><stop offset="100%" stop-color="#800000"/></linearGradient>
                        <linearGradient id="suitGrad" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#262626"/><stop offset="50%" stop-color="#0a0a0a"/><stop offset="100%" stop-color="#1f1f1f"/></linearGradient>
                        <linearGradient id="bladeGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#ffffff"/><stop offset="50%" stop-color="#00ffff"/><stop offset="100%" stop-color="#0088cc"/></linearGradient>
                    </defs>
                    <g class="hero-realistic">
                        <!-- Botas -->
                        <path d="M 85 390 L 70 420 L 125 420 L 125 390 Z" fill="#111"/>
                        <path d="M 165 390 L 165 420 L 220 420 L 205 390 Z" fill="#111"/>
                        <!-- Piernas -->
                        <path d="M 105 260 L 85 390 L 125 390 L 135 260 Z" fill="url(#suitGrad)"/>
                        <path d="M 85 340 L 90 390 L 125 390 L 115 340 Z" fill="var(--x-blue)"/> 
                        <path d="M 145 260 L 165 390 L 205 390 L 180 260 Z" fill="url(#suitGrad)"/>
                        <path d="M 160 340 L 165 390 L 205 390 L 195 340 Z" fill="var(--x-blue)"/> 
                        <!-- Brazo y Cuchilla trasera -->
                        <path d="M 165 140 L 210 270" stroke="url(#bladeGrad)" stroke-width="7" stroke-linecap="round"/>
                        <path d="M 155 130 L 175 145" stroke="var(--x-yellow)" stroke-width="5"/> 
                        <!-- Torso -->
                        <path d="M 95 125 L 195 125 L 175 260 L 115 260 Z" fill="url(#suitGrad)"/>
                        <path d="M 115 125 L 135 260 L 125 260 L 105 125 Z" fill="var(--x-blue)"/> 
                        <path d="M 175 125 L 155 260 L 165 260 L 185 125 Z" fill="var(--x-blue)"/>
                        <!-- Cinturón -->
                        <rect x="105" y="250" width="80" height="18" fill="#222" rx="3"/>
                        <circle cx="145" cy="259" r="10" fill="var(--x-yellow)" stroke="#000" stroke-width="2.5"/>
                        <path d="M 141 255 L 149 263 M 149 255 L 141 263" stroke="#000" stroke-width="2"/>
                        <!-- Brazo secundario -->
                        <path d="M 185 130 L 225 200 L 210 250" fill="none" stroke="url(#suitGrad)" stroke-width="16" stroke-linecap="round"/>
                        <circle cx="210" cy="250" r="11" fill="url(#skinGrad)"/>
                        <!-- Cabeza -->
                        <path d="M 130 110 L 160 110 L 165 135 L 125 135 Z" fill="url(#skinGrad)"/>
                        <circle cx="145" cy="85" r="30" fill="url(#skinGrad)"/>
                        <path d="M 112 85 C 108 25, 182 25, 178 85 L 183 98 C 170 92, 120 92, 107 98 Z" fill="#121212" stroke="none"/>
                        <path d="M 118 70 C 130 55, 160 55, 172 70" stroke="#333" stroke-width="3" fill="none"/> 
                        <path d="M 132 80 L 142 86 M 158 80 L 148 86" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
                        <path d="M 138 98 Q 145 106 152 98" stroke="#400" stroke-width="2.5" fill="none" stroke-linecap="round"/>
                    </g>
                    <!-- Brazo delantero (Ataca) -->
                    <g class="hero-arm-front" style="transform-origin: 105px 135px;">
                        <path d="M 75 230 L 25 50" stroke="url(#bladeGrad)" stroke-width="9" stroke-linecap="round"/>
                        <path d="M 58 210 L 92 225" stroke="var(--x-yellow)" stroke-width="5"/> 
                        <path d="M 105 135 L 65 190 L 75 230" fill="none" stroke="url(#suitGrad)" stroke-width="18" stroke-linecap="round"/>
                        <circle cx="75" cy="230" r="12" fill="url(#skinGrad)"/>
                    </g>
                </svg>
            </div>

            <!-- JEFE (Se inyecta vía JS dinámicamente según el Nivel) -->
            <div id="p2" class="fighter p2 idle">
                <!-- Vacío, esperando al JS -->
            </div>
        </main>
    </div>

    <!-- PANEL DE CONTROLES INFERIOR -->
    <div class="panel">
        <div class="controls">
            <button id="btn-atk" class="btn btn-atk" onclick="action('atk')" disabled>
                <span class="btn-text">TAJO X</span>
            </button>
            <button id="btn-def" class="btn btn-def" onclick="action('def')" disabled>
                <span class="btn-text">DEFENSA</span>
            </button>
            <button id="btn-ult" class="btn btn-ult" onclick="openTrivia()" disabled>
                <span class="btn-text">ENLACE CEREBRO</span>
            </button>
        </div>
    </div>

    <!-- MODAL DE PREGUNTAS -->
    <div class="modal" id="modal">
        <div class="m-box">
            <h2 class="m-title">SISTEMA CEREBRO: PROTOCOLO DE LICENCIAS</h2>
            <p class="m-q" id="m-q">Cargando base de datos...</p>
            <div class="opts-grid" id="m-opts"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
